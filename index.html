<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1"
    />
    <title>MSAtrades | Premium Cycle E-Commerce Store in UK</title>

    <!-- ✅ Basic SEO -->
    <meta
      name="description"
      content="MSAtrades is your trusted online cycle e-commerce store. Explore premium bicycles, cycling accessories, and gear with fast delivery and great prices."
    />
    <meta
      name="keywords"
      content="cycles, bicycles, e-commerce, cycle store, mountain bikes, road bikes, cycle accessories, MSATrades"
    />
    <meta name="author" content="MSAtrades" />

    <!-- ✅ Favicon -->
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <!-- ✅ Open Graph -->
    <meta property="og:title" content="MSAtrades | Premium Cycle E-Commerce" />
    <meta
      property="og:description"
      content="Shop premium cycles, accessories & gear at MSATrades. Hassle-free delivery, trusted quality, and great prices."
    />
    <meta property="og:image" content="/msatrades-og-image.png" />
    <meta property="og:url" content="https://msatrades.com" />
    <meta property="og:type" content="website" />

    <!-- ✅ Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MSAtrades | Premium Cycle E-Commerce" />
    <meta
      name="twitter:description"
      content="Explore premium bicycles & cycling gear at MSATrades. Trusted online store with hassle-free delivery."
    />
    <meta name="twitter:image" content="/msatrades-og-image.png" />

    <!-- ✅ Theme Color -->
    <meta name="theme-color" content="#f97316" />

    <style>
      /* ✅ Initial loader styles (show immediately before React mounts) */
      #initial-loader {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        font-family: sans-serif;
        font-size: 1.2rem;
        color: #f97316;
      }
      .spinner {
        border: 4px solid #eee;
        border-top: 4px solid #f97316;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
        margin-right: 12px;
      }
      @keyframes spin {
        100% {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- ✅ Shown instantly until React mounts -->
      <div id="initial-loader">
        <div class="spinner"></div>
        <p>Loading MSAtrades...</p>
      </div>
    </div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
